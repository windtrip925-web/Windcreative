<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Windcreat - Kantor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header><h1>🏢 Windcreat</h1><p>Kantor Pusat Karyawan AI</p></header>

  <main>
    <section>
      <h2>Karyawan</h2>
      <div id="karyawan" class="grid"></div>
    </section>

    <section>
      <h2>Antrean Persetujuan</h2>
      <div id="antrean"></div>
    </section>
  </main>

  <script>
    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    async function muatKaryawan() {
      const data = await (await fetch("/api/karyawan")).json();
      const wadah = document.getElementById("karyawan");
      wadah.innerHTML = "";
      data.forEach(k => {
        const kartu = document.createElement(k.link ? "a" : "div");
        kartu.className = "kartu";
        if (k.link) kartu.href = k.link;
        kartu.innerHTML = `<div class="ikon">${k.ikon}</div>
          <b>${k.nama}</b><small>${k.tugas}</small>
          <span class="status">${k.status}</span>`;
        wadah.appendChild(kartu);
      });
    }

    async function muatAntrean() {
      const data = await (await fetch("/api/antrean")).json();
      const wadah = document.getElementById("antrean");
      wadah.innerHTML = "";
      data.slice().reverse().forEach(t => {
        const baris = document.createElement("div");
        baris.className = "baris kolom";
        const tombol = t.status === "menunggu"
          ? `<button onclick="aksi(${t.id}, 'setujui')">✅ Setujui</button>
             <button class="tolak" onclick="aksi(${t.id}, 'tolak')">❌ Tolak</button>`
          : "";
        baris.innerHTML = `<div><b>${esc(t.judul)}</b><small>${esc(t.jenis)}</small></div>
          <div><span class="status">${esc(t.status)}</span> ${tombol}</div>`;

        if (t.slides && t.slides.length) {
          const galeri = document.createElement("div");
          galeri.className = "galeri";
          t.slides.forEach(s => {
            const a = document.createElement("a");
            a.href = s;
            a.target = "_blank";
            a.innerHTML = '<img src="' + s + '">';
            galeri.appendChild(a);
          });
          baris.appendChild(galeri);
        }
        if (t.video) {
          const v = document.createElement("video");
          v.src = t.video;
          v.controls = true;
          baris.appendChild(v);
        }
        if (t.caption) {
          const cap = document.createElement("pre");
          cap.className = "caption";
          cap.textContent = t.caption + "\n\n" + (t.hashtag || "");
          baris.appendChild(cap);
        }
        wadah.appendChild(baris);
      });
    }

    async function aksi(id, jenis) {
      await fetch(`/api/antrean/${id}/${jenis}`, {method: "POST"});
      muatAntrean();
    }

    muatKaryawan();
    muatAntrean();
  </script>
</body>
</html>
